[project]
name = "hocphi-info-mcp"
version = "0.1.0"
description = "Public read-only MCP server for hocphi.info Vietnamese university tuition data"
readme = "README.md"
authors = [{ name = "Nguyễn Văn Biên", email = "nvbien2000@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.8",
    "mypy>=1.13",
    # Ghim CHINH XAC: output sinh ra phu thuoc phien ban; doi phien ban la 1 PR co chu dich
    # (neu khong `make gen-check` do oan).
    "datamodel-code-generator==0.83.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hocphi_mcp"

# ── Cong cu (cung khuon hocphi-info-be) ─────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
# api_models.py duoc SINH ra tu openapi.json — khong lint/format tay (gen_models.sh tu format).
extend-exclude = ["src/hocphi_mcp/api_models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Van ban huong toi LLM (mo ta tool, docstring, huong dan) la NOI DUNG: ngat dong tuy tien
# lam khac nghia doc; formatter khong bao chuoi. Giu E501 cho phan code con lai.
"src/hocphi_mcp/tools/*" = ["E501"]
"src/hocphi_mcp/models.py" = ["E501"]
"src/hocphi_mcp/server.py" = ["E501"]
"src/hocphi_mcp/api_client.py" = ["E501"]
"src/hocphi_mcp/app.py" = ["E501"]
"src/hocphi_mcp/config.py" = ["E501"]
"src/hocphi_mcp/logging.py" = ["E501"]
"src/hocphi_mcp/middleware.py" = ["E501"]
# "Viet–Anh" co dau gach ngang en la chu that trong nhan hien thi.
"src/hocphi_mcp/tools/common.py" = ["E501", "RUF001"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
